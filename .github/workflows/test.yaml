name: Windows Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: false
        default: 'test'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      shell: powershell
      run: |
        (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python - --version 2.2.1
        echo "$env:APPDATA\Python\Scripts" | Out-File -Append -FilePath $env:GITHUB_PATH

    - name: Install dependencies
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        pip install pytest PyQt6 pytest-qt

    - name: Create config.ini
      shell: powershell
      env:
        CONFIG_B64: ${{ secrets.CONFIG_INI_BASE64 }}
      run: |
        $bytes = [Convert]::Frombase64String($env:CONFIG_B64)
        [IO.File]::WriteAllBytes("services/config.ini", $bytes)

    - name: Run tests with pytest
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path test-results
        python -m pytest test/ -v --junitxml=test-results/junit.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-test-results
        path: test-results/
        retention-days: 30
name: Dependency Vulnerability Scan

on:
  push:
  pull_request:
    branches:
      - integration

  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: false
        default: 'test'

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Install pip-audit in Poetry environment
        run: |
          poetry run pip install pip-audit

      - name: Run vulnerability scan
        run: |
          poetry run pip-audit --exit-code 0
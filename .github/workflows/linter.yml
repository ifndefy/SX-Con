name: Lint

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Lint environment'
        required: false
        default: 'test'

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      shell: powershell
      run: |
        (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python - --version 2.2.1
        echo "$env:APPDATA\Python\Scripts" | Out-File -Append -FilePath $env:GITHUB_PATH

    - name: Install dependencies
      shell: powershell
      env:
        POETRY_VIRTUALENVS_CREATE: "false"
      run: |
        python -m pip install --upgrade pip
        pip install flake8 ruff
        poetry install

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint with ruff
      run: |
        ruff check --select=E9,F63,F7,F82 .

    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports

    - name: Type check with pyright
      run: |
        pyright .

    - name: Security check with bandit
      run: |
        bandit -r . -ll
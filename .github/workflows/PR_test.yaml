name: Test PR

on:
  pull_request:
    branches:
      - integration

  workflow_dispatch: # manual execution
    inputs:
      environment:
        description: 'Test environment'
        required: false
        default: 'test'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest # the program is only designed to be run on Windows
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: powershell
      env:
        POETRY_VIRTUALENVS_CREATE: "false"
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest PyQt6 pytest-qt
        poetry install

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Create config.ini
      shell: powershell
      env:
        CONFIG_B64: ${{ secrets.CONFIG_INI_BASE64 }}
      run: |
        $bytes = [Convert]::Frombase64String($env:CONFIG_B64)
        [IO.File]::WriteAllBytes("services/config.ini", $bytes)

    - name: Test with pytest
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path test-results
        python -m pytest --verbose --junitxml=test-results/junit.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
